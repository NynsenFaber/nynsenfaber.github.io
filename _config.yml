# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title: Fabrizio Boninsegna
email: fabrizio.boninsegna@outlook.it
description: >-
  Fabrizio Boninsegna — PhD in Computer Science (University of Padova).
  Differential privacy, randomized algorithms and data structures for
  high-dimensional data.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://nynsenfaber.github.io" # the base hostname & protocol for your site
lang: en
timezone: Europe/Oslo

# ---------------------------------------------------------------------------
# Profile — drives the home page hero. Edit here, not in the layout.
# ---------------------------------------------------------------------------
profile:
  name: Fabrizio Boninsegna
  headline: PhD in Computer Science
  affiliation: AIoT Researcher at Havguard AS
  location: Oslo, Norway
  photo: /images/photos/me_montagna.JPG
  photo_alt: Fabrizio Boninsegna hiking in the Dolomites
  photo_caption: In the Dolomites, my home.
  bio: >-
    I am specialized in **differential privacy** and **data structures for
    high-dimensional data**, with state of the art contribution to quantile estimation, private release of hierarchical 
    data and approximate nearest neighbour search. I did my PhD at the University of
    Padova with [Francesco Silvestri](https://www.dei.unipd.it/~silvestri/index.html)
    and [Martin Aumüller](https://itu.dk/~maau/), after an MSc in Theoretical
    Physics. I have a genuine interest for the current trends in AI and data science, especially if there is an underlying fascinating mathematical theory.
    These days I am in Oslo, designing, building and embedding AI algorithm into autonomous systems.

# ---------------------------------------------------------------------------
# Primary contact / profile links — rendered as the hero button row.
# `icon` must match a name handled by _includes/icon.htmls
# ---------------------------------------------------------------------------
links:
  - label: Curriculum Vitae
    short: CV
    url: /documents/CV.pdf
    icon: document
    primary: true
  - label: Email
    short: Email
    url: mailto:fabrizio.boninsegna@outlook.it
    icon: mail
  - label: GitHub
    short: GitHub
    url: https://github.com/NynsenFaber
    icon: github
  - label: LinkedIn
    short: LinkedIn
    url: https://www.linkedin.com/in/fabrizio-boninsegna
    icon: linkedin

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav:
  - title: Home
    url: /
  - title: Research
    url: /research/
  - title: Blog
    url: /blog/

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed
  sass_dir: _sass

# Emits `\(...\)` / `\[...\]` delimiters, which KaTeX renders client-side.
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - INSTRUCTION.md
  - README.md
  - vendor
  - .idea
